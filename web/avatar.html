<!doctype html>
<html lang="en">

<style>

<body>
<canvas id="stage"></canvas>
<!-- Speech bubble: conversation only. It appears while she talks and fades
     when the conversation goes quiet; every control lives in the right-click menu. -->
<div id="bubble" class="hidden">
  <div class="head"><span class="dot" id="dot"></span><span class="name" id="name">Tia</span><span class="meter" id="meter" title="Voice level: blue is you, green is her"><i></i><i></i><i></i><i></i><i></i></span><span class="status" id="status">Loading…</span></div>
  <div class="lines"><div class="line user" id="lineUser"></div><div class="line assistant" id="lineAssistant"></div></div>
  <div class="row" id="steerRow">
    <button class="icon" id="muteBtn" title="Mute microphone"><svg class="on" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg><svg class="off" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5M3 17 17 3"/></svg></button>
    <button class="icon" id="hushBtn" title="Stop talking"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg></button>
    <input id="steer" placeholder="Steer or follow up…" maxlength="2000" autocomplete="off">
    <button class="icon" id="steerBtn" title="Send"><svg viewBox="0 0 20 20"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg></button>
    <button class="icon end" id="endBtn" title="End conversation"><svg viewBox="0 0 20 20"><path d="M3 11.5c4-3.5 10-3.5 14 0l-2.2 2.4-2.6-1.4v-2c-1.4-.5-3-.5-4.4 0v2l-2.6 1.4z" fill="currentColor" stroke="none"/></svg></button>
  </div>
</div>
<div id="listen" class="hidden"><svg viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg><span class="meter" id="listenMeter"><i></i><i></i><i></i><i></i><i></i></span><span id="listenText">Listening</span></div>
<div id="toast"></div>
<script type="module" src="/avatar3d.js"></script>
<script type="module">

  const now = performance.now(), mode = bubbleMode();
  const inMotion = Boolean(avatar && avatar.motion && avatar.motion.active && !avatar.motion.active.gesture) || Boolean(stage && stage.studio);

  else if (mode === 'always') show = live.state !== 'idle' || now < bubbleUntil;

const BUBBLE_RESERVE = 190; // fixed headroom: the bubble has a constant size and never scales with her
const BUBBLE_GAP = 26; // clear air between her crown and the bubble, even mid-motion

// ---------------------------------------------------------------- audio analysis (lip-sync)

  if (!speaking) { currentViseme = 'sil'; return; }

};
const attachRemoteAudio = stream => {
  audio.srcObject = stream; audio.play().catch(() => toast('Click Tia once to allow audio playback.'));
  try {
    audioContext = audioContext || new AudioContext();
    analyser = audioContext.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .5;
    audioContext.createMediaStreamSource(stream).connect(analyser);
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch (error) { console.warn('analyser', error); }
};
let visemeNames = ['sil', 'PP', 'FF', 'TH', 'DD', 'kk', 'CH', 'SS', 'nn', 'RR', 'aa', 'E', 'ih', 'oh', 'ou'];
// Microphone meter: proof that she can hear you, shown on the mic icon.
let micAnalyser = null, micData = null, micLevel = 0;
const attachMicrophone = stream => {
  try {
    audioContext = audioContext || new AudioContext();
    micAnalyser = audioContext.createAnalyser(); micAnalyser.fftSize = 512; micData = new Uint8Array(micAnalyser.fftSize);
    audioContext.createMediaStreamSource(stream).connect(micAnalyser);
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch (error) { console.warn('mic analyser', error); }

const sampleMicrophone = () => {
  if (!micAnalyser) { micLevel = 0; return; }
  micAnalyser.getByteTimeDomainData(micData);
  let sum = 0; for (let i = 0; i < micData.length; i++) { const v = (micData[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / micData.length);

};

// ---------------------------------------------------------------- avatar
const avatarApi = () => window.OpenClamAvatar3D ? Promise.resolve(window.OpenClamAvatar3D) : new Promise((resolve, reject) => { const t = setTimeout(() => reject(new Error('3D renderer did not load')), 10000); addEventListener('openclam-avatar3d-ready', () => { clearTimeout(t); resolve(window.OpenClamAvatar3D); }, { once: true }); });

  // Fallback for a plain GLB with embedded 4K maps: resample in place.

    if (!node.isMesh) return;
    for (const material of (Array.isArray(node.material) ? node.material : [node.material])) {

      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap']) {

async function loadAvatar() {

  if (!api.supported()) { setStatus('WebGL is unavailable.', 'error'); return; }

  const instance = api.create({ width: 1024, height: 1536 });
  try {
    await instance.load(info.modelURL, { resources: Boolean(info.residentAvailable), pose: info.pose, yaw: info.yaw, performance: quality().performance, motionLibrary: info.motionsURL });

function applyQuality() {

let frameGeometry = null; // {view, fit} of the last painted frame for hit tests and bubble placement
let manualUntil = 0, dragging = false;

  if (!avatar || !ready) return;

    const scale = stage.scale;

      fit = stage.studio.project(surface);

    if (stage.studio) { const { fit } = frameGeometry; stage.studio.manual({ ...fit, x: fit.x + dx, y: fit.y + dy }, { x: 0, y: 0, width: innerWidth, height: innerHeight }); companion.pause(performance.now()); }

});
const endGesture = () => {
  if (gesture) clearTimeout(gesture.timer);
  gesture = null; dragging = false; stageEl.classList.remove('dragging');
};
stageEl.addEventListener('pointerup', endGesture); stageEl.addEventListener('pointercancel', endGesture);
// Double-click her head to start or end a conversation.
const onHead = (x, y) => {
  if (!frameGeometry) return false;
  const { fit, layout } = frameGeometry; const [, by, , bh] = layout.bounds;
  const crown = avatar && avatar.crownProjection ? avatar.crownProjection() : null;
  const top = crown && Number.isFinite(crown.y) ? fit.y + crown.y * fit.scale : fit.y + by * fit.scale;

stageEl.addEventListener('dblclick', event => {
  if (!paintedAt(event.clientX, event.clientY)) return;
  if (!onHead(event.clientX, event.clientY)) { toast(live.state === 'idle' ? 'Double-click my head to start talking.' : 'Double-click my head to end the conversation.'); return; }
  toggleCall();
});
let resizeTimer = 0, pendingScale = 1;
const MIN_WINDOW_WIDTH = 360; // the bubble is 340 px wide and never shrinks with her
if (innerWidth < MIN_WINDOW_WIDTH) void gla.window.resizeTo(MIN_WINDOW_WIDTH, Math.round(innerHeight * MIN_WINDOW_WIDTH / innerWidth));
addEventListener('wheel', event => {
  if (!avatar) return;
  event.preventDefault();
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
  if (event.ctrlKey) { // trackpad pinch arrives as ctrl+wheel
    const delta = Math.max(-90, Math.min(90, event.deltaY * unit));
    pendingScale *= Math.exp(-delta * .0075);
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(async () => { let s = pendingScale; pendingScale = 1; if (stage) { stage.scale = Math.min(6, Math.max(.15, stage.scale * s)); lastFrame = 0; wake(); return; } s = Math.max(s, MIN_WINDOW_WIDTH / innerWidth); await gla.window.resizeTo(innerWidth * s, innerHeight * s); lastFrame = 0; wake(); }, 40);
    return;
  }
  const dx = Math.max(-120, Math.min(120, event.deltaX * unit || 0)), dy = Math.max(-120, Math.min(120, event.deltaY * unit || 0));

  avatar.setOrbit(userOrbit);
  manualUntil = performance.now() + 300; wake();
  clearTimeout(wheelSave); wheelSave = setTimeout(() => gla.setSettings({ orbitYaw: userOrbit.yaw, orbitPitch: userOrbit.pitch }), 400);
}, { passive: false });
let wheelSave = 0;
// Click-through: transparent pixels pass to the app underneath, unless the bubble is there.
let ignoring = false;
addEventListener('mousemove', event => {
  const overBubble = !bubble.classList.contains('hidden') && bubble.contains(event.target);
  const hit = overBubble || dragging || Boolean(gesture) || paintedAt(event.clientX, event.clientY);
  if (hit === ignoring) { ignoring = !hit; gla.window.setIgnoreMouse(ignoring); }
});
addEventListener('resize', () => { lastFrame = 0; wake(); });

// ---------------------------------------------------------------- settings
const applySettings = next => {
  const previous = settings; settings = next;
  stageEl.style.opacity = String(settings.opacity ?? 1);
  syncBubble();
  $('#name').textContent = settings.personaName || 'Tia';
  if (avatar && previous.quality !== settings.quality) applyQuality();
  if (avatar && previous.avatarDir !== settings.avatarDir) { avatar.dispose(); avatar = null; ready = false; void loadAvatar(); }
  if (!avatar && settings.avatar && settings.avatar.ok && !ready) void loadAvatar();
};
gla.onSettings(applySettings);
applySettings(settings);
</script>
