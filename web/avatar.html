<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPT-Live Avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #f4f4f6; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #bubble { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: min(92%, 340px); background: rgba(24, 24, 28, .86); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 10px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); backdrop-filter: blur(14px); -webkit-app-region: no-drag; transition: opacity .18s ease, transform .18s ease; }
  #bubble.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-6px); }
  #bubble .head { display: flex; align-items: center; gap: 8px; }
  #bubble .dot { width: 8px; height: 8px; border-radius: 50%; background: #7a7a82; flex: 0 0 auto; }
  #bubble .dot.connecting { background: #f5b942; animation: pulse 1s infinite; } #bubble .dot.live { background: #4cd964; } #bubble .dot.speaking { background: #4cd964; box-shadow: 0 0 0 4px rgba(76,217,100,.25); } #bubble .dot.error { background: #ff5b4d; }
  @keyframes pulse { 50% { opacity: .35; } }
  #bubble .name { font-weight: 600; } #bubble .status { color: #b9b9c2; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #bubble .lines { margin: 6px 0 4px; max-height: 110px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
  #bubble .line { font-size: 12.5px; line-height: 1.35; padding: 5px 8px; border-radius: 9px; background: rgba(255,255,255,.07); }
  #bubble .line.user { background: rgba(72,120,255,.24); align-self: flex-end; max-width: 92%; } #bubble .line.assistant { align-self: flex-start; max-width: 92%; }
  #bubble .line.pending { opacity: .7; } #bubble .line:empty { display: none; }
  #bubble .row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  #bubble button { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: inherit; border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  #bubble button:hover { background: rgba(255,255,255,.16); } #bubble button.pri { background: #2f6df6; border-color: #2f6df6; } #bubble button.danger { background: rgba(255,91,77,.35); border-color: rgba(255,91,77,.5); }
  #bubble button[disabled] { opacity: .45; cursor: default; }
  #bubble input { flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.25); color: inherit; border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 12px; }
  #bubble .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11px; color: #9a9aa4; }
  #bubble .foot button { padding: 2px 6px; font-size: 11px; border: 0; background: transparent; color: #9a9aa4; } #bubble .foot button:hover { color: #fff; background: transparent; }
  #toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(24,24,28,.9); color: #fff; padding: 6px 10px; border-radius: 10px; font-size: 12px; max-width: 92%; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bubble">
  <div class="head"><span class="dot" id="dot"></span><span class="name" id="name">Tia</span><span class="status" id="status">Loading…</span></div>
  <div class="lines"><div class="line user" id="lineUser"></div><div class="line assistant" id="lineAssistant"></div></div>
  <div class="row">
    <button class="pri" id="callBtn" disabled>Start conversation</button>
    <button id="muteBtn" disabled title="Mute your microphone">Mute</button>
    <button id="hushBtn" disabled title="Ask her to stop talking">Stop talking</button>
  </div>
  <div class="row"><input id="steer" placeholder="Steer her: e.g. speak more slowly, do a wave…" disabled><button id="steerBtn" disabled>Send</button></div>
  <div class="foot"><span id="usage"></span><span><button id="settingsBtn">Settings</button><button id="hideBubbleBtn" title="Hide the bubble (double-click Tia to show it)">Hide</button><button id="quitBtn">Quit</button></span></div>
</div>
<div id="toast"></div>
<script type="module" src="/avatar3d.js"></script>
<script type="module">
import { LiveClient } from '/live-client.js';
import { CompanionController } from '/avatar3d-companion.js';

const $ = s => document.querySelector(s);
const stage = $('#stage'); const context = stage.getContext('2d', { alpha: true });
const bubble = $('#bubble');
let settings = await gla.getSettings();
let avatar = null; let companion = null; let ready = false; let renderRequest = 0; let lastFrame = 0;
let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => { reduce = e.matches; });
const QUALITY = { friendly: { performance: 'eco', dprCap: 1, cap: 1280, activeFps: 24, idleFps: 8, maxTexture: 1024 }, balanced: { performance: 'balanced', dprCap: 2, cap: 2048, activeFps: 30, idleFps: 15, maxTexture: 2048 }, best: { performance: 'quality', dprCap: 3, cap: 4096, activeFps: 30, idleFps: 24, maxTexture: Infinity } };
const quality = () => QUALITY[settings.quality] || QUALITY.balanced;
const toast = (text, ms = 3200) => { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), ms); };
const setStatus = (text, dot = '') => { $('#status').textContent = text; $('#dot').className = 'dot ' + dot; };

// ---------------------------------------------------------------- audio analysis (lip-sync)
const audio = new Audio(); audio.autoplay = true;
let audioContext = null, analyser = null, timeData = null, freqData = null, audioPeak = .018;
let audioSignal = { rms: 0, relative: 0, low: 0, mid: 0, high: 0, centroid: 0, zcr: 0 };
const measureAudioSignal = (samples, spectrum, sampleRate) => {
  let squareSum = 0, crossings = 0, previous = 0;
  for (let i = 0; i < samples.length; i++) { const v = (samples[i] - 128) / 128; squareSum += v * v; if (i && ((v >= 0) !== (previous >= 0))) crossings++; previous = v; }
  const rms = samples.length ? Math.sqrt(squareSum / samples.length) : 0;
  const bands = { low: [80, 520], mid: [520, 2200], high: [2200, 7200] }; const totals = { low: 0, mid: 0, high: 0 }, counts = { low: 0, mid: 0, high: 0 };
  let weighted = 0, energyTotal = 0; const nyquist = Math.max(1, sampleRate || 48000) * .5;
  for (let i = 1; i < spectrum.length; i++) { const f = i / spectrum.length * nyquist; if (f > bands.high[1]) break; const m = spectrum[i] / 255, e = m * m; energyTotal += e; weighted += f * e; for (const n of ['low', 'mid', 'high']) if (f >= bands[n][0] && f < bands[n][1]) { totals[n] += e; counts[n]++; break; } }
  return { rms, relative: 0, low: Math.sqrt(totals.low / Math.max(1, counts.low)), mid: Math.sqrt(totals.mid / Math.max(1, counts.mid)), high: Math.sqrt(totals.high / Math.max(1, counts.high)), centroid: energyTotal ? Math.min(1, weighted / energyTotal / bands.high[1]) : 0, zcr: samples.length > 1 ? crossings / (samples.length - 1) : 0 };
};
const firstAvailableViseme = (valid, names) => { for (const n of names) if (valid.has(n)) return n; return valid.has('sil') ? 'sil' : [...valid][0] || 'sil'; };
const classifyAudioViseme = (signal, validNames) => {
  const valid = new Set(validNames); const intensity = Math.max(0, Math.min(1, signal.relative)); const { low, mid, high, centroid, zcr } = signal;
  if ((zcr > .145 && high > low * .82) || high > Math.max(low, mid) * 1.22) return firstAvailableViseme(valid, ['SS', 'FF', 'TH', 'ih']);
  if (centroid < .31 && low > high * 1.12) return firstAvailableViseme(valid, intensity > .72 ? ['oh', 'aa', 'ou'] : ['ou', 'RR', 'oh']);
  if (intensity > .78) return firstAvailableViseme(valid, ['aa', 'oh', 'E']);
  if (centroid > .55) return firstAvailableViseme(valid, intensity > .46 ? ['E', 'ih', 'SS'] : ['ih', 'nn']);
  if (intensity > .48) return firstAvailableViseme(valid, ['E', 'oh', 'aa']);
  return firstAvailableViseme(valid, ['ih', 'nn', 'RR']);
};
const mouth = { viseme: 'sil', changedAt: 0, audibleUntil: 0 };
let currentViseme = 'sil', speaking = false;
const sampleAudio = now => {
  if (!analyser) { audioSignal.relative = 0; speaking = false; currentViseme = 'sil'; return; }
  if (!timeData) { timeData = new Uint8Array(analyser.fftSize); freqData = new Uint8Array(analyser.frequencyBinCount); }
  analyser.getByteTimeDomainData(timeData); analyser.getByteFrequencyData(freqData);
  const measured = measureAudioSignal(timeData, freqData, audioContext.sampleRate);
  audioPeak = Math.max(.018, measured.rms, audioPeak * .994);
  audioSignal = { ...measured, relative: Math.min(1, measured.rms / audioPeak) };
  const audible = measured.rms > .012;
  if (audible) mouth.audibleUntil = now + 160;
  speaking = now < mouth.audibleUntil;
  if (!speaking) { currentViseme = 'sil'; return; }
  const wanted = audible ? classifyAudioViseme(audioSignal, visemeNames) : mouth.viseme;
  if (wanted !== mouth.viseme && now - mouth.changedAt > 70) { mouth.viseme = wanted; mouth.changedAt = now; }
  currentViseme = mouth.viseme;
};
const attachRemoteAudio = stream => {
  audio.srcObject = stream; audio.play().catch(() => toast('Click Tia once to allow audio playback.'));
  try {
    audioContext = audioContext || new AudioContext();
    analyser = audioContext.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = .5;
    audioContext.createMediaStreamSource(stream).connect(analyser);
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch (error) { console.warn('analyser', error); }
};
let visemeNames = ['sil', 'PP', 'FF', 'TH', 'DD', 'kk', 'CH', 'SS', 'nn', 'RR', 'aa', 'E', 'ih', 'oh', 'ou'];

// ---------------------------------------------------------------- avatar
const avatarApi = () => window.OpenClamAvatar3D ? Promise.resolve(window.OpenClamAvatar3D) : new Promise((resolve, reject) => { const t = setTimeout(() => reject(new Error('3D renderer did not load')), 10000); addEventListener('openclam-avatar3d-ready', () => { clearTimeout(t); resolve(window.OpenClamAvatar3D); }, { once: true }); });
const downscaleTextures = (instance, maxSize) => {
  // Fallback for a plain GLB with embedded 4K maps: resample in place.
  if (!Number.isFinite(maxSize)) return;
  const seen = new Set();
  instance.model.traverse(node => {
    if (!node.isMesh) return;
    for (const material of (Array.isArray(node.material) ? node.material : [node.material])) {
      if (!material) continue;
      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap']) {
        const texture = material[key]; const image = texture && texture.image;
        if (!image || seen.has(texture) || !(image.width > maxSize || image.height > maxSize)) continue;
        seen.add(texture);
        const scale = maxSize / Math.max(image.width, image.height);
        const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        texture.image = canvas; texture.needsUpdate = true;
      }
    }
  });
};
async function loadAvatar() {
  const info = settings.avatar;
  if (!info || !info.ok) { setStatus(info && info.problem ? info.problem : 'Choose an avatar in Settings.', 'error'); return; }
  setStatus('Loading Tia…');
  const api = await avatarApi();
  if (!api.supported()) { setStatus('WebGL is unavailable.', 'error'); return; }
  visemeNames = info.visemes || visemeNames;
  const instance = api.create({ width: 1024, height: 1536 });
  try {
    await instance.load(info.modelURL, { resources: Boolean(info.residentAvailable), pose: info.pose, yaw: info.yaw, performance: quality().performance, motionLibrary: info.motionsURL });
  } catch (error) { instance.dispose(); setStatus('Avatar failed to load: ' + error.message, 'error'); return; }
  if (!info.residentAvailable) downscaleTextures(instance, quality().maxTexture);
  avatar = instance; ready = true;
  avatar.setOrbit({ yaw: Number(settings.orbitYaw) || 0, pitch: Number(settings.orbitPitch) || 0 });
  if (avatar.options) { companion = new CompanionController(); companion.reactions = true; avatar.companion = companion; }
  $('#name').textContent = settings.personaName || info.name || 'Tia';
  setStatus(settings.hasKey ? 'Ready. Double-click me or press Start.' : 'Add your OpenAI key in Settings.');
  $('#callBtn').disabled = !settings.hasKey;
  wake();
}
function applyQuality() {
  if (!avatar) return;
  if (avatar.options) avatar.options.select({ ...avatar.options.selection, performance: quality().performance });
  if (!settings.avatar.residentAvailable) downscaleTextures(avatar, quality().maxTexture);
  lastFrame = 0; wake();
}

// ---------------------------------------------------------------- render loop
let blinkNext = performance.now() + 2500, blinkAt = 0;
const blinkAmounts = now => {
  if (now >= blinkNext) { blinkAt = now; blinkNext = now + 2500 + Math.random() * 3500; }
  const t = (now - blinkAt) / 170; const v = t >= 0 && t < 1 ? Math.sin(t * Math.PI) : 0;
  return { l: v, r: v };
};
const pointer = { x: 0, y: 0, seen: false };
let gaze = { x: 0, y: 0 };
let frameGeometry = null; // {view, fit} of the last painted frame for hit tests and bubble placement
let manualUntil = 0, dragging = false;
function paint(now) {
  if (!avatar || !ready) return;
  const q = quality();
  const dpr = Math.max(1, Math.min(q.dprCap, devicePixelRatio || 1));
  const cssW = innerWidth, cssH = innerHeight;
  if (stage.width !== Math.round(cssW * dpr) || stage.height !== Math.round(cssH * dpr)) { stage.width = Math.round(cssW * dpr); stage.height = Math.round(cssH * dpr); }
  avatar.prepareMotionFrame(now, reduce);
  const layout = avatar.layout();
  // Frame the whole resting body with a little air, keeping the window aspect,
  // and reserve room above her head for the bubble.
  const [bx, by, bw, bh] = layout.bounds; const pad = Math.max(bw, bh) * .04;
  const reserveCss = bubble.classList.contains('hidden') ? 10 : bubble.offsetHeight + 18;
  const aspect = cssW / cssH;
  // logical height needed = body + bottom pad + reserve (in logical units, solved with the final scale)
  let vh = (bh + pad) / (1 - reserveCss / cssH); let vw = vh * aspect;
  if (vw < bw + pad * 2) { vw = bw + pad * 2; vh = vw / aspect; }
  const view = { x: bx + bw / 2 - vw / 2, y: by + bh + pad - vh, w: vw, h: vh };
  const scale = cssW / vw; const cap = q.cap / Math.max(cssW * dpr, cssH * dpr, 1); const density = scale * dpr * Math.min(1, cap);
  view.projectedHeight = 1536 * scale; view.pixelWidth = Math.max(8, Math.round(vw * density)); view.pixelHeight = Math.max(8, Math.round(vh * density));
  sampleAudio(now);
  const target = pointer.seen ? { x: Math.max(-1, Math.min(1, (pointer.x / cssW - .5) * 2)) * .6, y: Math.max(-1, Math.min(1, (pointer.y / cssH - .5) * -2)) * .35 } : { x: 0, y: 0 };
  gaze = { x: gaze.x + (target.x - gaze.x) * .08, y: gaze.y + (target.y - gaze.y) * .08 };
  const expression = { smile: .35, ...(avatar.motion ? avatar.motion.expression(now, reduce) : {}) };
  const state = { reduce, viseme: currentViseme, intensity: speaking ? Math.max(.4, audioSignal.relative) : 0, blink: blinkAmounts(now), gaze, speaking, breathe: 1 + .0012 * Math.sin(now / 1600 * Math.PI * 2), expression, head: companion ? companion.gesture(now, speaking, reduce) : undefined };
  const image = avatar.render(now, state, view);
  // While a texture-residency swap is in flight the renderer returns without
  // drawing; keep the previous frame instead of flashing an empty window.
  if (avatar.resources && !avatar.resources.ready) return;
  context.setTransform(1, 0, 0, 1, 0, 0); context.clearRect(0, 0, stage.width, stage.height);
  context.drawImage(image, 0, 0, image.width, image.height, 0, 0, stage.width, stage.height);
  frameGeometry = { view, scale, layout };
  placeBubble();
  consumeReaction(now);
}
function placeBubble() {
  if (!frameGeometry || !bubble) return;
  const { view, scale, layout } = frameGeometry;
  const headTop = (layout.bounds[1] - view.y) * scale;
  bubble.style.top = Math.max(6, Math.min(innerHeight - bubble.offsetHeight - 6, headTop - bubble.offsetHeight - 8)) + 'px';
}
window.gla_debug = () => ({ state: live.state, latestUser, assistantTurn, turnID, speaking, viseme: currentViseme, relative: Number(audioSignal.relative.toFixed(2)),
  pending: companion && companion.pendingReaction && { kind: companion.pendingReaction.kind, clipID: companion.pendingReaction.clipID, action: companion.pendingReaction.action },
  motionActive: avatar && avatar.motion && avatar.motion.active && avatar.motion.active.id, clips: avatar && avatar.motion ? avatar.motion.clips.size : 0, status: document.querySelector('#status').textContent, played: window.gla_played });
window.gla_played = [];
function loop(now) {
  renderRequest = 0;
  const q = quality();
  const active = speaking || live.state !== 'idle' || (avatar && avatar.motion && avatar.motion.active) || now < manualUntil || dragging;
  const interval = 1000 / (active ? q.activeFps : q.idleFps);
  if (now - lastFrame >= interval) { lastFrame = now; try { paint(now); } catch (error) { console.error(error); } }
  renderRequest = requestAnimationFrame(loop);
}
const wake = () => { if (!renderRequest) renderRequest = requestAnimationFrame(loop); };

// ---------------------------------------------------------------- motions from replies
const performAction = async action => {
  if (!avatar || !companion) return;
  if (action === 'stay') { companion.command('stay'); avatar.motion && avatar.motion.stop(); return; }
  if (['closer', 'back', 'follow', 'come', 'walk-around', 'run-around'].includes(action) || action.startsWith('go-')) { toast('Walking is not available in this app yet.'); return; }
  let clipID = action.startsWith('clip:') ? action.slice(5) : action === 'dance' && avatar.motion.clips.has('joyful-sway') ? 'joyful-sway' : ['wave', 'dance'].includes(action) ? action : null;
  if (clipID) { if (!avatar.motion.clips.has(clipID)) { toast('That motion is not installed.'); return; } avatar.motion.stop(); window.gla_played.push(clipID); await avatar.motion.play(clipID, { loop: false }); wake(); return; }
  const id = { heart: 'Ps001.heart', sit: 'Ps004.sit', stand: '' }[action];
  if (id !== undefined && avatar.options) { avatar.motion && avatar.motion.stop(); avatar.options.select({ ...avatar.options.selection, body: id, hands: undefined, leftHand: undefined, rightHand: undefined, playTransitions: 'false' }); wake(); }
};
function consumeReaction(now) {
  if (!companion || !avatar || !avatar.motion) return;
  const pending = companion.pendingReaction;
  const blocked = dragging || now < manualUntil || (Boolean(avatar.motion.active) && !(pending && (pending.action || pending.clipID)));
  const reaction = companion.takeReaction(now, avatar.motion.clips, blocked, { hasProp: Boolean(avatar.options && avatar.options.selection.prop) });
  if (!reaction) return;
  if (reaction.startsWith('action:')) void performAction(reaction.slice(7)).catch(e => toast(e.message));
  else { avatar.motion.stop(); window.gla_played.push(reaction); void avatar.motion.play(reaction, { loop: false }).catch(e => toast(e.message)); }
}
let latestUser = '', turnID = '';
const considerReply = reply => { if (!companion) return; companion.consider(latestUser, reply, undefined, performance.now(), { clips: avatar && avatar.motion ? avatar.motion.clips : null, turnID }); };

// ---------------------------------------------------------------- live session
const live = new LiveClient({ createSession: sdp => gla.createLiveSession(sdp) });
let assistantTurn = ''; let usage = null;
live.addEventListener('state', ({ detail }) => {
  const s = detail.state; $('#callBtn').textContent = s === 'idle' ? 'Start conversation' : s === 'connecting' ? 'Connecting…' : 'End conversation';
  $('#callBtn').className = s === 'idle' ? 'pri' : 'danger'; $('#callBtn').disabled = s === 'connecting' || !settings.hasKey;
  for (const id of ['muteBtn', 'hushBtn', 'steer', 'steerBtn']) $('#' + id).disabled = s !== 'connected';
  if (s === 'idle') { setStatus(detail.reason === 'user' || detail.reason === 'close_requested' ? 'Conversation ended.' : `Ended (${detail.reason}).`); analyser = null; audio.srcObject = null; currentViseme = 'sil'; speaking = false; $('#muteBtn').textContent = 'Mute'; }
  if (s === 'connecting') setStatus('Connecting to GPT-Live…', 'connecting');
  if (s === 'connected') { setStatus('Live. Talk to me.', 'live'); latestUser = ''; assistantTurn = ''; turnID = 'live:greeting'; live.appendInstructions('Greet the user warmly in one short sentence right now, then pause and listen.'); }
  wake();
});
live.addEventListener('remote-track', ({ detail }) => attachRemoteAudio(detail.stream));
live.addEventListener('error', ({ detail }) => { setStatus(detail.message, 'error'); toast(detail.message, 5000); });
live.addEventListener('usage', ({ detail }) => { if (detail && Number.isFinite(detail.duration_seconds)) $('#usage').textContent = `${Math.round(detail.duration_seconds)} s`; });
live.addEventListener('transcript', ({ detail }) => {
  const { role, text, final } = detail; if (!text) return;
  const line = role === 'user' ? $('#lineUser') : $('#lineAssistant');
  line.textContent = text; line.classList.toggle('pending', !final);
  if (role === 'user') {
    if (!final) { if (turnID !== detail.id) { turnID = detail.id; assistantTurn = ''; $('#lineAssistant').textContent = ''; } }
    else latestUser = text;
  } else if (final) { assistantTurn = assistantTurn ? assistantTurn + ' ' + text : text; considerReply(assistantTurn); }
});
setInterval(() => { if (live.state === 'connected') $('#dot').className = 'dot ' + (speaking ? 'speaking' : 'live'); }, 250);

const toggleCall = () => {
  if (!settings.hasKey) { gla.openSettings(); return; }
  if (live.state === 'idle') { if (audioContext && audioContext.state === 'suspended') audioContext.resume(); audio.play().catch(() => {}); live.start(); }
  else live.stop('user');
};
$('#callBtn').onclick = toggleCall;
$('#muteBtn').onclick = () => { live.setMuted(!live.muted); $('#muteBtn').textContent = live.muted ? 'Unmute' : 'Mute'; };
$('#hushBtn').onclick = () => { live.stopSpeaking(); toast('Asked her to stop.'); };
const steer = () => { const text = $('#steer').value.trim(); if (!text) return; live.appendInstructions(text); $('#steer').value = ''; toast('Sent.'); };
$('#steerBtn').onclick = steer; $('#steer').addEventListener('keydown', e => { if (e.key === 'Enter') steer(); });
$('#settingsBtn').onclick = () => gla.openSettings();
$('#quitBtn').onclick = () => gla.quit();
$('#hideBubbleBtn').onclick = () => bubble.classList.add('hidden');

// ---------------------------------------------------------------- interaction: drag, rotate, pinch, hit testing
const paintedAt = (x, y) => { if (!frameGeometry) return false; const dpr = stage.width / innerWidth; try { return context.getImageData(Math.round(x * dpr), Math.round(y * dpr), 1, 1).data[3] > 18; } catch { return true; } };
let gesture = null;
stage.addEventListener('pointerdown', event => {
  if (event.button !== 0 || !paintedAt(event.clientX, event.clientY)) return;
  gesture = { x: event.screenX, y: event.screenY, startOrbit: avatar ? { ...avatar.orbit } : null, rotating: Boolean(avatar && event.altKey), moved: false };
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener('pointermove', event => {
  pointer.x = event.clientX; pointer.y = event.clientY; pointer.seen = true; wake();
  if (!gesture) return;
  const dx = event.screenX - gesture.x, dy = event.screenY - gesture.y;
  if (gesture.rotating && avatar) { avatar.setOrbit({ yaw: gesture.startOrbit.yaw - dx * .008, pitch: gesture.startOrbit.pitch + dy * .008 }); manualUntil = performance.now() + 300; gesture.moved = true; return; }
  if (!gesture.moved && Math.hypot(dx, dy) < 4) return;
  gesture.moved = true; dragging = true; stage.classList.add('dragging');
  gla.window.moveBy(dx, dy); gesture.x = event.screenX; gesture.y = event.screenY;
});
const endGesture = () => {
  if (gesture && gesture.rotating && avatar) gla.setSettings({ orbitYaw: avatar.orbit.yaw, orbitPitch: avatar.orbit.pitch });
  gesture = null; dragging = false; stage.classList.remove('dragging');
};
stage.addEventListener('pointerup', endGesture); stage.addEventListener('pointercancel', endGesture);
stage.addEventListener('dblclick', event => { if (!paintedAt(event.clientX, event.clientY)) return; if (bubble.classList.contains('hidden')) { bubble.classList.remove('hidden'); return; } toggleCall(); });
let resizeTimer = 0, pendingScale = 1;
addEventListener('wheel', event => {
  if (!avatar) return;
  event.preventDefault();
  const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? innerHeight : 1;
  if (event.ctrlKey) { // trackpad pinch arrives as ctrl+wheel
    const delta = Math.max(-90, Math.min(90, event.deltaY * unit));
    pendingScale *= Math.exp(-delta * .0075);
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(async () => { const s = pendingScale; pendingScale = 1; await gla.window.resizeTo(innerWidth * s, innerHeight * s); lastFrame = 0; wake(); }, 40);
    return;
  }
  const dx = Math.max(-120, Math.min(120, event.deltaX * unit || 0)), dy = Math.max(-120, Math.min(120, event.deltaY * unit || 0));
  avatar.setOrbit({ yaw: avatar.orbit.yaw + dx * .006, pitch: avatar.orbit.pitch - dy * .006 });
  manualUntil = performance.now() + 300; wake();
  clearTimeout(wheelSave); wheelSave = setTimeout(() => gla.setSettings({ orbitYaw: avatar.orbit.yaw, orbitPitch: avatar.orbit.pitch }), 400);
}, { passive: false });
let wheelSave = 0;
// Click-through: transparent pixels pass to the app underneath, unless the bubble is there.
let ignoring = false;
addEventListener('mousemove', event => {
  const overBubble = !bubble.classList.contains('hidden') && bubble.contains(event.target);
  const hit = overBubble || dragging || Boolean(gesture) || paintedAt(event.clientX, event.clientY);
  if (hit === ignoring) { ignoring = !hit; gla.window.setIgnoreMouse(ignoring); }
});
addEventListener('resize', () => { lastFrame = 0; wake(); });

// ---------------------------------------------------------------- settings
const applySettings = next => {
  const previous = settings; settings = next;
  stage.style.opacity = String(settings.opacity ?? 1);
  bubble.classList.toggle('hidden', settings.bubble === false);
  $('#name').textContent = settings.personaName || 'Tia';
  $('#callBtn').disabled = !settings.hasKey || live.state === 'connecting';
  if (avatar && previous.quality !== settings.quality) applyQuality();
  if (avatar && previous.avatarDir !== settings.avatarDir) { avatar.dispose(); avatar = null; ready = false; void loadAvatar(); }
  if (!avatar && settings.avatar && settings.avatar.ok && !ready) void loadAvatar();
};
gla.onSettings(applySettings);
applySettings(settings);
</script>
