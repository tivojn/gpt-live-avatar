<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPT-Live Avatar</title>
<link rel="stylesheet" href="/agent-composer.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #f4f4f6; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  /* The bubble follows the system appearance: light tokens by default, dark under prefers-color-scheme: dark. */
  :root { --bubble-bg: rgba(250,250,250,.94); --bubble-line: rgba(0,0,0,.09); --bubble-text: #1d1d1f; --bubble-dim: #6e6e73; --bubble-user: rgba(72,120,255,.18); --bubble-assistant: rgba(0,0,0,.05); --bubble-chip: rgba(0,0,0,.07); --bubble-chip-hover: rgba(0,0,0,.13); --bubble-input: rgba(0,0,0,.05); --bubble-shadow: 0 10px 30px rgba(0,0,0,.18); }
  @media (prefers-color-scheme: dark) { :root { --bubble-bg: rgba(24,24,28,.88); --bubble-line: rgba(255,255,255,.14); --bubble-text: #f4f4f6; --bubble-dim: #b9b9c2; --bubble-user: rgba(72,120,255,.28); --bubble-assistant: rgba(255,255,255,.08); --bubble-chip: rgba(128,128,128,.22); --bubble-chip-hover: rgba(128,128,128,.36); --bubble-input: rgba(128,128,128,.14); --bubble-shadow: 0 10px 30px rgba(0,0,0,.35); } }
  #bubble { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 340px; box-sizing: border-box; color: var(--bubble-text); background: var(--bubble-bg); border: 1px solid var(--bubble-line); border-radius: 14px; padding: 8px 10px 8px; box-shadow: var(--bubble-shadow); backdrop-filter: blur(14px); -webkit-app-region: no-drag; transition: opacity .18s ease, transform .18s ease; }
  #bubble { max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain; }
  #bubble.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-6px); }
  #bubble .head { display: flex; align-items: center; gap: 8px; }
  #bubble .dot { width: 8px; height: 8px; border-radius: 50%; background: #7a7a82; flex: 0 0 auto; }
  #bubble .dot.connecting { background: #f5b942; animation: pulse 1s infinite; } #bubble .dot.live { background: #29aa94; animation: listening-dot 3.4s ease-in-out infinite; } #bubble .dot.speaking { background: #4cd964; box-shadow: 0 0 0 4px rgba(76,217,100,.25); } #bubble .dot.error { background: #ff5b4d; }
  @keyframes pulse { 50% { opacity: .35; } }
  :is(#bubble, #listen) .meter { display: inline-flex; align-items: center; gap: 2px; height: 14px; width: 26px; flex: 0 0 auto; }
  :is(#bubble, #listen) .meter i { display: block; width: 3px; height: 3px; border-radius: 2px; background: var(--bubble-dim); transition: height .06s linear, background .2s; }
  :is(#bubble, #listen) .meter.user i { background: #3b82f6; } :is(#bubble, #listen) .meter.ai i { background: #34c759; }
  #bubble .name { font-weight: 600; } #bubble .status { color: var(--bubble-dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #bubble .lines { margin: 6px 0 2px; max-height: 96px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
  #bubble .line { font-size: 12.5px; line-height: 1.35; padding: 5px 8px; border-radius: 9px; background: var(--bubble-assistant); }
  #bubble .line.user { background: var(--bubble-user); align-self: flex-end; max-width: 92%; } #bubble .line.assistant { align-self: flex-start; max-width: 92%; }
  #bubble .line.pending { opacity: .7; } #bubble .line:empty { display: none; }
  #taskUpdate { margin-top: 7px; font-size: 12.5px; line-height: 1.4; max-height: 88px; overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap; }
  #taskUpdate[hidden] { display: none; }
  #bubble.composing #taskUpdate { max-height: min(240px, 42vh); }
  #taskUpdate, #bubble .line { -webkit-user-select: text; user-select: text; }
  #composerTip { margin: 7px 0 0; color: var(--bubble-dim); font-size: 11px; line-height: 1.4; }
  #bubble [hidden] { display: none !important; }
  #bubble button:disabled { opacity: .45; cursor: default; }
  #bubble.has-task .lines { display: none; }
  #bubble .dot.working { background: #d99828; animation: pulse 1.4s infinite; }
  @media (prefers-reduced-motion: reduce) { #bubble .dot.working { animation: none; } }
  #bubble .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; } #bubble .row[hidden] { display: none; }
  #bubble button.icon { flex: 0 0 auto; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--bubble-chip); color: inherit; display: grid; place-items: center; padding: 0; cursor: pointer; }
  #bubble button.icon:hover { background: var(--bubble-chip-hover); } #bubble button.icon.active { background: rgba(255,91,77,.55); }
  /* Mic: plain icon while listening (its ring grows with your voice level); the same icon with a slash when muted. */
  #bubble button.icon svg.off { display: none; } #bubble button.icon.active svg.on { display: none; } #bubble button.icon.active svg.off { display: block; }
  #bubble button.icon.active { background: var(--bubble-chip); opacity: .75; }
  #bubble button.icon.listening { box-shadow: 0 0 0 calc(var(--mic-level, 0) * 7px) var(--bubble-chip-hover); }
  #bubble button.icon.end { background: rgba(255,91,77,.75); color: #fff; } #bubble button.icon.end:hover { background: rgba(255,91,77,.95); }
  #bubble button.icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #bubble input { flex: 1; min-width: 0; border: 1px solid var(--bubble-line); background: var(--bubble-input); color: inherit; border-radius: 14px; padding: 6px 10px; font: inherit; font-size: 12.5px; outline: none; }
  #bubble input::placeholder { color: var(--bubble-dim); }
  #bubble input:focus { border-color: rgba(127,181,255,.8); }
  /* Listening pill: shown whenever a conversation is on and the bubble is hidden. */
  #listen { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 6px 13px 6px 7px; border-radius: 24px; color: var(--bubble-text); background: var(--bubble-bg); border: 1px solid var(--bubble-line); box-shadow: 0 4px 18px rgba(0,0,0,.12); backdrop-filter: blur(14px); font-size: 12px; font-weight: 500; pointer-events: auto; transition: opacity .18s; }
  #listen.hidden { opacity: 0; pointer-events: none; }
  #listen .listen-orb { position: relative; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #168574; background: rgba(41,170,148,.12); flex: 0 0 auto; }
  #listen .listen-orb::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgba(41,170,148,.18); opacity: 0; }
  #listen.listening .listen-orb::before { animation: listening-breath 3.4s ease-in-out infinite; }
  #listen svg { position: relative; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  #listen .meter { width: 22px; height: 14px; gap: 2px; }
  #listen .meter i { width: 3px; background: #29aa94; opacity: .7; }
  #listen.muted .listen-orb { color: var(--bubble-dim); background: var(--bubble-chip); }
  #listen.muted .meter i { background: var(--bubble-dim); }
  #listen.muted:not(.hidden) { opacity: .75; }
  @keyframes listening-breath { 0%,100% { transform: scale(.84); opacity: .2; } 50% { transform: scale(1.4); opacity: .65; } }
  @keyframes listening-dot { 0%,100% { box-shadow: 0 0 0 2px rgba(41,170,148,.08); } 50% { box-shadow: 0 0 0 5px rgba(41,170,148,.2); } }
  #listen.hidden .listen-orb::before, #bubble.hidden .dot { animation-play-state: paused; }
  @media (prefers-color-scheme: dark) { #listen .listen-orb { color: #66dbc8; } }
  @media (prefers-reduced-motion: reduce) { #listen.listening .listen-orb::before, #bubble .dot { animation: none; } }
  #toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--bubble-bg); color: var(--bubble-text); border: 1px solid var(--bubble-line); box-shadow: var(--bubble-shadow); padding: 6px 10px; border-radius: 10px; font-size: 12px; max-width: 92%; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<!-- Speech and task progress share the same overhead bubble. -->
<div id="bubble" class="hidden">
  <div class="head"><span class="dot" id="dot"></span><span class="name" id="name">Avatar</span><span class="meter" id="meter" title="Voice level: blue is you, green is her"><i></i><i></i><i></i><i></i><i></i></span><span class="status" id="status">Loading…</span><button type="button" class="icon" id="composerClose" hidden title="Close typing controls" aria-label="Close typing controls"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
  <div id="taskUpdate" hidden role="status" aria-live="polite"></div>
  <div class="lines"><div class="line user" id="lineUser"></div><div class="line assistant" id="lineAssistant"></div></div>
  <p id="composerTip" hidden>Try “Sing along”, “Dance along”, or “Do a backflip”. Tap the mic or double-click my head to talk.</p>
  <div class="row" id="steerRow" hidden>
    <button class="icon" id="muteBtn" title="Mute microphone"><svg class="on" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg><svg class="off" viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5M3 17 17 3"/></svg></button>
    <button class="icon" id="hushBtn" title="Stop talking"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg></button>
    <input id="steer" aria-label="Ask the avatar" placeholder="Try “Do a backflip”…" maxlength="2000" autocomplete="off">
    <button class="icon" id="steerBtn" title="Send"><svg viewBox="0 0 20 20"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg></button>
    <button class="icon end" id="endBtn" title="End conversation"><svg viewBox="0 0 20 20"><path d="M3 11.5c4-3.5 10-3.5 14 0l-2.2 2.4-2.6-1.4v-2c-1.4-.5-3-.5-4.4 0v2l-2.6 1.4z" fill="currentColor" stroke="none"/></svg></button>
  </div>
  <div id="agentQuestions"></div>
</div>
<div id="listen" class="hidden" role="button" tabindex="0" aria-label="Show conversation"><span class="listen-orb" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg></span><span class="meter" id="listenMeter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="listenText">Listening</span></div>
<div id="toast"></div>
<script type="module" src="/avatar3d.js"></script>
<script type="module" src="/sing.js"></script>
<script type="module">
import { MusicCommandRouter } from '/music-command.js';
import {closeupFit} from '/avatar-closeup.js';
import {zoomScale,zoomFit,keepZoomVisible} from '/avatar-zoom.js';
import { installAgentUI } from './agent-client.js';
import { shortenHomePaths } from './path-display.js';
import { DelegateClient } from './delegate-client.js';
import { LiveClient } from '/live-client.js';
import { SpeechOutput, silentSpeech } from '/lip-sync.js';
import { ConversationSounds } from '/conversation-sounds.js';
import { BubblePolicy } from '/bubble-policy.js';
import { VoicePreview } from '/voice-preview.js';
import { frameDue, surfaceSize, renderPixelBudget, textureBudget } from '/avatar-render-budget.js';
import { CompanionController, AvatarStudioStage, isSpatialAction } from '/avatar3d-companion.js';

const $ = s => document.querySelector(s);
const stageEl = $('#stage'); const context = stageEl.getContext('2d', { alpha: true });
const bubble = $('#bubble');
$('#listen').onclick=()=>showBubble();
$('#listen').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showBubble();}};
let settings = await gla.getSettings();
let avatar = null; let companion = null; let ready = false; let renderRequest = 0; let lastFrame = 0;
let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => { reduce = e.matches; });
const QUALITY = { friendly: { performance: 'eco', dprCap: 1, cap: 1280, activeFps: 30, idleFps: 10, maxTexture: 1024 }, balanced: { performance: 'balanced', dprCap: 2, cap: 2048, activeFps: 30, idleFps: 15, maxTexture: 2048 }, best: { performance: 'quality', dprCap: 3, cap: 4096, activeFps: 30, idleFps: 15, maxTexture: Infinity } };
const conversationSounds = new ConversationSounds(()=>settings.conversationSounds!==false);
const quality = () => QUALITY[settings.quality] || QUALITY.balanced;
const displayText = text => shortenHomePaths(text, settings.userHome);
const currentCharacter = () => settings.avatar?.name || settings.personaName || 'Avatar';
const isCurrentCharacter = name => !name || String(name).toLowerCase() === currentCharacter().toLowerCase();
const toast = (text, ms = 3200) => { const t = $('#toast'); t.textContent = displayText(text); t.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), ms); };
let taskActivity = null, conversationStatus = {text: 'Loading…', dot: ''};
let agentUI = null, composerOpen = false, questionOpen = false, composerGeneration = 0, composerResult = null;
const questionHosts = new Map();
const syncQuestionHosts = () => {
  for(const [character,host] of questionHosts)host.hidden=!isCurrentCharacter(character);
  questionOpen=Boolean(questionHosts.get(currentCharacter())?.querySelector('.agent-question'));
};
const questionHost = character => {
  if(!isCurrentCharacter(character))return null;
  if(!questionHosts.has(character)){const host=document.createElement('div');questionHosts.set(character,host);$('#agentQuestions').append(host);}
  syncQuestionHosts();return questionHosts.get(character);
};
const currentTask = () => taskActivity && (performance.now() < taskActivity.until || (composerOpen && !taskActivity.active)) ? taskActivity : null;
const paintStatus = () => { const task=currentTask(); $('#status').textContent=displayText(task?.label||conversationStatus.text); $('#dot').className='dot '+(task?(task.active?'working':task.state==='error'?'error':''):conversationStatus.dot); };
const setStatus = (text, dot = '') => { conversationStatus={text,dot};paintStatus();if(dot==='error')toast(text,6000); };
const taskStatus = (_message, update) => { if(!update||!isCurrentCharacter(update.character))return;taskActivity=update;if(update.active)composerResult=null;syncBubble();placeBubble(); };
const bubblePolicy = new BubblePolicy();
const bubbleMode = () => settings.bubbleMode || (settings.bubble === false ? 'off' : 'auto');
const singing = () => { try { return window.gla_sing?.() || null; } catch { return null; } };
let wasPerforming = false;
// Whatever she is doing, this ends it. The music stopping is handled inside the
// sing session, but a viewer who simply wants her to stand still needs a way in
// that does not depend on her hearing anything.
const stopPerforming = () => {
  let stopped = false;
  try { stopped = Boolean(window.gla_sing_stop?.()); } catch {}
  try { if (avatar?.motion?.active) { avatar.motion.stop(); stopped = true; } } catch {}
  return stopped;
};
const showBubble = (ms = 9000) => { bubblePolicy.incoming(performance.now(), ms); syncBubble(); };
const syncBubble = () => {
  const performing = Boolean(singing() || avatar?.motion?.active);
  const beganPerforming = performing && !wasPerforming;
  wasPerforming = performing; // update before blur can re-enter syncBubble
  if (beganPerforming && !questionOpen) {
    composerOpen = false;
    if (bubble.contains(document.activeElement)) document.activeElement.blur();
  }
  const task=currentTask(), forced=composerOpen||questionOpen, connected=live.state==='connected';
  const detail=composerResult&&task?.id===composerResult.id ? composerResult.text : displayText(task?.detail||'');
  bubblePolicy.activity=Boolean(task);
  bubble.classList.toggle('has-task',Boolean(task));
  bubble.classList.toggle('composing',forced);
  $('#taskUpdate').hidden=!detail;
  if($('#taskUpdate').textContent!==detail)$('#taskUpdate').textContent=detail;
  paintStatus();
  bubblePolicy.setMode(bubbleMode());
  if (bubbleMode() === 'off' && !forced && bubble.contains(document.activeElement)) document.activeElement.blur();
  bubblePolicy.editor = connected && bubble.contains(document.activeElement);
  // Keep automatic status bubbles off the performance. A newly opened input
  // or agent question stays visible, including before it receives focus.
  bubble.classList.toggle('hidden', !(forced || (!performing && bubblePolicy.visible(performance.now()))));
  $('#steerRow').hidden = false; // Every visible bubble accepts a typed request.
  $('#composerClose').hidden = !composerOpen;
  $('#composerTip').hidden = !forced || live.state !== 'idle';
  $('#steer').placeholder = connected ? 'Say something or follow up…' : 'Ask me to do something…';
  const busy=agentUI?.isBusy(currentCharacter());
  $('#steerBtn').disabled = live.state === 'connecting' || (!connected && Boolean(busy) && !musicRouter.parse($('#steer').value));
  $('#hushBtn').hidden = !connected && !busy && !performing;
  $('#hushBtn').title = performing ? 'Stop dancing' : busy ? 'Stop task' : 'Stop talking';
  $('#hushBtn').setAttribute('aria-label', $('#hushBtn').title);
  $('#endBtn').hidden = live.state === 'idle';
  $('#muteBtn').disabled = live.state === 'connecting';
};
const openComposer = character => {
  if(!isCurrentCharacter(character))return;
  composerOpen=true;syncBubble();placeBubble();
  gla.window.setIgnoreMouse(false);ignoring=false;
  $('#steer').focus();
};
const closeComposer = () => { composerOpen=false;if(bubble.contains(document.activeElement))document.activeElement.blur();syncBubble();placeBubble(); };
$('#composerClose').onclick=closeComposer;
$('#steer').addEventListener('focus', () => { composerOpen=true;syncBubble(); });
$('#steer').addEventListener('blur', syncBubble);
setInterval(syncBubble, 100);
const BUBBLE_RESERVE = 190; // fixed render headroom; a longer bubble scrolls without resizing her surface
const BUBBLE_GAP = 26; // clear air between her crown and the bubble, even mid-motion

// ---------------------------------------------------------------- streaming audio-to-viseme recognition
let audioContext = null, speechOutput = null, speechMuted = false;
let audioSignal = silentSpeech(), currentViseme = 'sil', speaking = false;
// Voice preview temporarily mutes this output without touching the microphone.
const audio = { get muted(){return speechMuted;}, set muted(v){speechMuted=Boolean(v);if(speechOutput)speechOutput.muted=speechMuted;}, play(){return audioContext?.resume()||Promise.resolve();} };
const sampleAudio = () => {
  const voice=speechOutput?.sample();
  const music=window.gla_sing_sample?.(settings.avatar?.slug);
  audioSignal = voice?.speaking && voice.rms>.003 ? voice : music || voice || silentSpeech();
  currentViseme = audioSignal.viseme; speaking = audioSignal.speaking;
};
const attachRemoteAudio = stream => {
  speechOutput?.close();
  audioContext ||= new AudioContext();
  speechOutput = new SpeechOutput(audioContext, {onError:message=>toast(message,7000)});
  speechOutput.muted=speechMuted;
  speechOutput.attach(stream);void audioContext.resume().catch(()=>toast('Click the avatar to allow audio playback.'));
};
let visemeNames = ['sil', 'PP', 'FF', 'TH', 'DD', 'kk', 'CH', 'SS', 'nn', 'RR', 'aa', 'E', 'ih', 'oh', 'ou'];
// Microphone meter: proof that she can hear you, shown on the mic icon.
let micAnalyser = null, micData = null, micLevel = 0;
const attachMicrophone = stream => {
  try {
    audioContext = audioContext || new AudioContext();
    micAnalyser = audioContext.createAnalyser(); micAnalyser.fftSize = 512; micData = new Uint8Array(micAnalyser.fftSize);
    audioContext.createMediaStreamSource(stream).connect(micAnalyser);
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch (error) { console.warn('mic analyser', error); }
};
const sampleMicrophone = () => {
  if (!micAnalyser) { micLevel = 0; return; }
  micAnalyser.getByteTimeDomainData(micData);
  let sum = 0; for (let i = 0; i < micData.length; i++) { const v = (micData[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / micData.length);
  micLevel = Math.max(rms * 4, micLevel * .85);
};

// ---------------------------------------------------------------- avatar
const avatarApi = () => window.OpenClamAvatar3D ? Promise.resolve(window.OpenClamAvatar3D) : new Promise((resolve, reject) => { const t = setTimeout(() => reject(new Error('3D renderer did not load')), 10000); addEventListener('openclam-avatar3d-ready', () => { clearTimeout(t); resolve(window.OpenClamAvatar3D); }, { once: true }); });
const downscaleTextures = (instance, maxSize) => {
  // Fallback for a plain GLB with embedded 4K maps: resample in place.
  if (!Number.isFinite(maxSize)) return;
  const seen = new Set();
  instance.model.traverse(node => {
    if (!node.isMesh) return;
    for (const material of (Array.isArray(node.material) ? node.material : [node.material])) {
      if (!material) continue;
      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap']) {
        const texture = material[key]; const image = texture && texture.image;
        if (!image || seen.has(texture) || !(image.width > maxSize || image.height > maxSize)) continue;
        seen.add(texture);
        const scale = maxSize / Math.max(image.width, image.height);
        const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        texture.image = canvas; texture.needsUpdate = true;
      }
    }
  });
};
let loadGeneration = 0, loadingAvatar = false, avatarSwitchGeneration = 0, suspended=false;
async function loadAvatar() {
  window.gla_sing_stop?.();
  if(suspended)return;
  const generation = ++loadGeneration; loadingAvatar = true;
  const info = settings.avatar;
  if (!info || !info.ok) { loadingAvatar = false; setStatus(info && info.problem ? info.problem : 'Choose an avatar in Settings.', 'error'); return; }
  setStatus(`Loading ${info.name || 'avatar'}…`);
  const api = await avatarApi();
  if (generation !== loadGeneration) return;
  if (!api.supported()) { loadingAvatar = false; setStatus('WebGL is unavailable.', 'error'); return; }
  visemeNames = info.visemes || visemeNames;
  const instance = api.create({ width: 1024, height: 1536 });
  try {
    await instance.load(info.modelURL, { resources: Boolean(info.residentAvailable), pose: info.pose, yaw: info.yaw, performance: quality().performance, motionLibrary: info.motionsURL, appearanceLibrary: info.appearanceURL, textureLimit:textureBudget(1,settings.hardware?.memoryGB) });
  } catch (error) { instance.dispose(); if (generation === loadGeneration) { loadingAvatar = false; setStatus('Avatar failed to load: ' + error.message, 'error'); } return; }
  if (generation !== loadGeneration) { instance.dispose(); return; }
  loadingAvatar = false;
  if (!info.residentAvailable) downscaleTextures(instance, quality().maxTexture);
  avatar = instance; ready = true;
  try {
    const slug=info.slug || info.dir;
    const legacy=JSON.parse(localStorage.getItem(avatarOptionsKey()) || 'null');
    const look=settings.avatarLooks?.[slug] ?? legacy ?? settings.appearanceDefaults?.[slug] ?? {};
    avatar.options?.select({ ...look, performance: quality().performance });
    if(info.slug)void gla.saveAppearance(info.slug,avatar.options.selection);
  } catch {}

// Double-click her head to start or end a conversation.

addEventListener('resize', () => { lastFrame = 0; wake(); });

  if (avatar && previous.quality !== settings.quality) applyQuality();
